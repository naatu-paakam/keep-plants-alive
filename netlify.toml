[build]
  command   = "npm run build"
  publish   = "dist"

[dev]
  command    = "npm run dev"
  targetPort = 5180
  port       = 8888
  framework  = "vite"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
