[build]
  command   = "npm run build"
  publish   = "dist"

[dev]
  command    = "npm run dev"
  targetPort = 5180
  port       = 8888
  framework  = "vite"

[build.environment]
  NODE_VERSION = "20"
  # VERTEX_LOCATION and VERTEX_PROJECT_ID are GCP config, not secrets — omit from scanner
  SECRETS_SCAN_OMIT_KEYS = "VERTEX_LOCATION,VERTEX_PROJECT_ID"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
